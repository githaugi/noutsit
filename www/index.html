<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Noutsit</title>
<meta name="theme-color" content="#3d6b5c">
<style>
:root{--bg:#f6f5f1;--surface:#fff;--text:#1d1d1b;--muted:#77756e;--line:#e4e2db;--accent:#3d6b5c;--accent-t:#fff;--del:#c8473d;--pin:#d9a21b;--shadow:0 1px 3px rgba(0,0,0,.08);--g1:hsl(140 14% 76%);--g2:hsl(30 15% 64%);color-scheme:light;box-sizing:border-box;padding-top:max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px));padding-bottom:max(env(safe-area-inset-bottom,0px),var(--safe-area-inset-bottom,0px))}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161715;--surface:#222421;--text:#ecebe6;--muted:#9a9890;--line:#34362f;--accent:#7fb7a3;--accent-t:#10211b;--del:#e0675d;--pin:#e8b83c;--shadow:none;--g1:hsl(140 9% 25%);--g2:hsl(30 10% 12%);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161715;--surface:#222421;--text:#ecebe6;--muted:#9a9890;--line:#34362f;--accent:#7fb7a3;--accent-t:#10211b;--del:#e0675d;--pin:#e8b83c;--shadow:none;--g1:hsl(140 9% 25%);--g2:hsl(30 10% 12%);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(circle farthest-corner at 50% 38%,var(--g1),var(--g2)) fixed no-repeat;background-color:var(--g2);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
[hidden]{display:none!important}
header{position:sticky;top:max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px));background:var(--bg);z-index:5;padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
h1{font-size:20px;margin:0;font-weight:650;letter-spacing:-.01em;flex:1}
.ib{border:0;background:none;color:var(--muted);font-size:20px;cursor:pointer;padding:4px 8px;border-radius:8px}
.ib:hover{color:var(--text)}
.ib.x:hover{color:var(--del)}
main{max-width:640px;margin:0 auto;padding:14px 16px 120px}
.hint{color:var(--muted);font-size:13px;margin:0 0 12px}
#grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.tile{--h:30;--c1:hsl(var(--h) 38% 92%);--c2:hsl(calc(var(--h) - 10) 42% 80%);--chip:rgba(255,255,255,.5);--bd:hsl(var(--h) 28% 76%);position:relative;height:200px;background:linear-gradient(150deg,var(--c1),var(--c2));border-radius:16px;box-shadow:0 1px 2px rgba(0,0,0,.12),0 4px 12px rgba(0,0,0,.06);border:1px solid var(--bd);overflow:hidden;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation;transition:transform .15s}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tile{--c1:hsl(var(--h) 18% 26%);--c2:hsl(calc(var(--h) - 10) 22% 17%);--chip:rgba(0,0,0,.22);--bd:hsl(var(--h) 14% 32%)}}
:root[data-theme="dark"] .tile{--c1:hsl(var(--h) 18% 26%);--c2:hsl(calc(var(--h) - 10) 22% 17%);--chip:rgba(0,0,0,.22);--bd:hsl(var(--h) 14% 32%)}
.tile.press{transform:scale(.96)}
.tile .hd{display:flex;justify-content:space-between;align-items:baseline;padding:13px 16px 8px}
.tile .hd b{font-size:17px;font-weight:650}
.tile .hd small{color:var(--muted)}
.tile .pv{padding:0 14px;display:flex;flex-direction:column;gap:6px}
.tile .pv img{width:100%;height:72px;object-fit:cover;border-radius:8px;display:block;pointer-events:none}
.tile .pv p{margin:0;font-size:13px;line-height:1.3;color:var(--text);opacity:.85;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;background:var(--chip);padding:6px 8px;border-radius:8px}
.tile .em{padding:0 16px;color:var(--muted);font-size:13px}
.tile::after{content:"";position:absolute;left:0;right:0;bottom:0;height:30px;background:linear-gradient(transparent,var(--c2));pointer-events:none}
.hc{display:grid;grid-template-columns:40px 1fr 40px}
.hc h1{text-align:center;flex:none}
#hint{margin:60vh 0 0;text-align:center}
#home header{background:transparent;border-bottom-color:transparent;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#bv{position:fixed;inset:0;z-index:8;overflow-y:auto;background:var(--bg);overscroll-behavior:contain}
#bv header{top:0;padding-top:calc(14px + max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px)))}
.wrap{position:relative;margin-bottom:12px;border-radius:14px;overflow:hidden;background:var(--line)}
.wrap .l,.wrap .r{position:absolute;top:0;bottom:0;display:flex;align-items:center;font-weight:600;font-size:14px;padding:0 20px;color:#fff}
.wrap .l{left:0;background:var(--pin)}.wrap .r{right:0;background:var(--del)}
.card{position:relative;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:14px;touch-action:pan-y;transition:transform .18s}
.card.drag{opacity:.4}
.card.pinned{border-left:4px solid var(--pin)}
.card img{width:100%;max-height:420px;object-fit:cover;border-radius:10px;display:block;margin-bottom:10px}
.txt{white-space:pre-wrap;word-break:break-word;outline:none;min-height:1.2em}
.txt:empty::before{content:"Empty note";color:var(--muted)}
.foot{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px;color:var(--muted)}
.foot .sp{flex:1}
select,input[type=text],textarea{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.foot select{font-size:12px;padding:4px 6px;max-width:130px}
.empty{text-align:center;color:var(--muted);padding:60px 20px}
.fab{position:fixed;right:20px;bottom:calc(20px + max(env(safe-area-inset-bottom,0px),var(--safe-area-inset-bottom,0px)));width:60px;height:60px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-t);font-size:32px;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.3);cursor:pointer;z-index:6}
.back{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + max(env(safe-area-inset-bottom,0px),var(--safe-area-inset-bottom,0px)));max-height:90vh;overflow:auto}
.sheet h2{margin:0 0 12px;font-size:17px}
.sheet textarea{width:100%;min-height:110px;resize:vertical;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.row select{flex:1}
.btn{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;padding:9px 14px;font:inherit;cursor:pointer}
.btn.p{background:var(--accent);color:var(--accent-t);border-color:var(--accent);font-weight:600}
.btn.d{color:var(--del)}
#prev{max-width:100%;max-height:160px;border-radius:10px;margin-bottom:10px;display:none}
.brow{display:flex;gap:8px;margin-bottom:8px}.brow input{flex:1}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;display:none;gap:12px;align-items:center}
#toast button{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;cursor:pointer;font:inherit}
</style>
</head>
<body>
<section id="home">
  <header class="hc"><span></span><h1>Noutsit</h1><button class="ib" id="gear" aria-label="Manage boards">⚙</button></header>
  <main>
    <div id="grid"></div>
    <p class="hint" id="hint">Tap a board to open it. Press and hold to add a note.</p>
  </main>
</section>

<section id="bv" hidden>
  <header><button class="ib" id="bk" aria-label="Back">←</button><h1 id="bt"></h1><span id="bc" class="hint" style="margin:0"></span></header>
  <main id="list"></main>
  <button class="fab" id="fab" aria-label="Add note">+</button>
</section>

<div class="back" id="addBack" hidden>
  <div class="sheet" role="dialog" aria-label="New note">
    <h2 id="at">New note</h2>
    <textarea id="nt" placeholder="Write something…"></textarea>
    <img id="prev" alt="">
    <div class="row">
      <label class="btn" for="file">📷 Add photo</label>
      <input type="file" id="file" accept="image/*" hidden>
      <select id="nb" aria-label="Board"></select>
    </div>
    <div class="row" style="justify-content:flex-end;margin:0">
      <button class="btn" id="cancel">Cancel</button>
      <button class="btn p" id="save">Save note</button>
    </div>
  </div>
</div>

<div class="back" id="bBack" hidden>
  <div class="sheet" role="dialog" aria-label="Manage boards">
    <h2>Boards</h2>
    <div id="bList"></div>
    <div class="brow"><input type="text" id="newB" placeholder="New board name"><button class="btn p" id="addB">Add</button></div>
    <div class="row" style="margin:12px 0 0"><button class="btn" id="exp">Export backup</button><button class="btn" id="imp">Import backup</button><input type="file" id="impf" accept=".json,application/json" hidden><span style="flex:1"></span><button class="btn p" id="bDone">Done</button></div>
    <p class="hint" style="margin:8px 0 0">Import replaces all current notes and boards.</p>
  </div>
</div>
<div id="toast"><span id="tmsg"></span><button id="undo">Undo</button></div>

<script>
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
let S={boards:['home','shopping','kids','misc'].map(n=>({id:n,name:n})),notes:[]};
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('boards-notes',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function load(){try{const db=await idb();const v=await new Promise((res,rej)=>{const q=db.transaction('kv').objectStore('kv').get('state');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});if(v&&v.boards)S=v}catch(e){}
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}}
let st;function save(){clearTimeout(st);st=setTimeout(async()=>{try{const db=await idb();db.transaction('kv','readwrite').objectStore('kv').put(S,'state')}catch(e){toast('Could not save – storage unavailable')}},150)}
let dragId=null,pend=null,lastDel=null,tt,curB=null,addTo=null;

function toast(m,undo){$('#tmsg').textContent=m;$('#undo').style.display=undo?'':'none';$('#toast').style.display='flex';clearTimeout(tt);tt=setTimeout(()=>$('#toast').style.display='none',4000)}
$('#undo').onclick=()=>{if(lastDel){S.notes.splice(lastDel.i,0,lastDel.n);lastDel=null;save();render()}$('#toast').style.display='none'};
const items=id=>S.notes.filter(n=>n.board===id).sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0));
const bname=id=>(S.boards.find(b=>b.id===id)||{}).name||'';

function moveTo(id,b){const n=S.notes.find(x=>x.id===id);if(n){n.board=b;save();render();toast('Moved to '+bname(b))}}
function del(id){const i=S.notes.findIndex(x=>x.id===id);if(i<0)return;lastDel={i,n:S.notes[i]};S.notes.splice(i,1);save();render();toast('Note deleted',true)}
function pin(id){const n=S.notes.find(x=>x.id===id);n.pinned=!n.pinned;save();render()}

/* routing + zoom */
let origin=null;
function route(){const m=location.hash.match(/^#b-(\w+)$/);const nb=m&&S.boards.find(b=>b.id===m[1])?m[1]:null;
  const prev=curB;curB=nb;renderHome();
  if(nb){renderBoard();const v=$('#bv');v.hidden=false;v.scrollTop=0;document.body.style.overflow='hidden';if(!prev)zoom('in')}
  else{document.body.style.overflow='';if(prev)zoom('out');else $('#bv').hidden=true}}
function zoom(dir){const v=$('#bv'),o=origin||{x:innerWidth/2,y:innerHeight/2};
  v.style.transformOrigin=o.x+'px '+o.y+'px';
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){v.hidden=dir==='out';return}
  const ease='cubic-bezier(.2,.8,.2,1)';
  if(dir==='in'){v.animate([{transform:'scale(.2)',opacity:0},{transform:'scale(1)',opacity:1}],{duration:320,easing:ease})}
  else{const a=v.animate([{transform:'scale(1)',opacity:1},{transform:'scale(.2)',opacity:0}],{duration:280,easing:ease,fill:'forwards'});
    a.onfinish=()=>{if(!curB){v.hidden=true}a.cancel()};
    $('#home').animate([{transform:'scale(1.06)',opacity:.6},{transform:'scale(1)',opacity:1}],{duration:320,easing:ease})}}
window.addEventListener('hashchange',route);
function open(id){location.hash='b-'+id}
$('#bk').onclick=()=>{location.hash=''};

function render(){renderHome();if(curB)renderBoard()}

/* home grid */
function renderHome(){
  const g=$('#grid');g.innerHTML='';
  S.boards.forEach(b=>{
    const its=items(b.id);
    const t=document.createElement('div');t.className='tile';t.style.setProperty('--h',[24,44,6,34,52,14,38,0][S.boards.indexOf(b)%8]);
    const hd=document.createElement('div');hd.className='hd';
    const nm=document.createElement('b');nm.textContent=b.name;
    const ct=document.createElement('small');ct.textContent=its.length;
    hd.append(nm,ct);t.appendChild(hd);
    if(!its.length){const e=document.createElement('div');e.className='em';e.textContent='Empty – hold to add';t.appendChild(e)}
    else{const pv=document.createElement('div');pv.className='pv';
      its.slice(0,3).forEach((n,i)=>{
        if(n.img&&i===0){const im=document.createElement('img');im.src=n.img;im.alt='';pv.appendChild(im)}
        if(n.text){const p=document.createElement('p');p.textContent=n.text;pv.appendChild(p)}
      });t.appendChild(pv)}
    // tap = open, long press = quick add
    let timer=null,long=false,sx=0,sy=0;
    const clear=()=>{clearTimeout(timer);t.classList.remove('press')};
    t.addEventListener('pointerdown',e=>{long=false;sx=e.clientX;sy=e.clientY;t.classList.add('press');
      timer=setTimeout(()=>{long=true;t.classList.remove('press');if(navigator.vibrate)try{navigator.vibrate(30)}catch(x){}openAdd(b.id)},500)});
    t.addEventListener('pointermove',e=>{if(timer&&Math.hypot(e.clientX-sx,e.clientY-sy)>10)clear()});
    ['pointerup','pointerleave','pointercancel'].forEach(ev=>t.addEventListener(ev,clear));
    t.addEventListener('click',()=>{if(long){long=false;return}const r=t.getBoundingClientRect();origin={x:r.left+r.width/2,y:r.top+r.height/2};open(b.id)});
    t.addEventListener('contextmenu',e=>e.preventDefault());
    g.appendChild(t);
  });
}

/* fullscreen board */
function renderBoard(){
  const its=items(curB);
  $('#bt').textContent=bname(curB);$('#bc').textContent=its.length+(its.length===1?' note':' notes');
  const list=$('#list');list.innerHTML='';
  if(!its.length){list.innerHTML='<div class="empty">No notes here yet.<br>Tap + to add one.</div>';return}
  its.forEach(n=>list.appendChild(card(n)));
}

function card(n){
  const w=document.createElement('div');w.className='wrap';
  w.innerHTML='<div class="l">'+(n.pinned?'Unpin':'Pin')+'</div><div class="r">Delete</div>';
  const c=document.createElement('article');c.className='card'+(n.pinned?' pinned':'');c.draggable=true;
  if(n.img){const im=document.createElement('img');im.src=n.img;im.alt='Note photo';c.appendChild(im)}
  const t=document.createElement('div');t.className='txt';t.contentEditable='true';t.textContent=n.text||'';
  t.onblur=()=>{n.text=t.innerText.trim();save()};c.appendChild(t);
  const f=document.createElement('div');f.className='foot';
  const d=document.createElement('span');d.textContent=new Date(n.t).toLocaleDateString(undefined,{day:'numeric',month:'short'});
  const sp=document.createElement('span');sp.className='sp';
  const sel=document.createElement('select');sel.title='Move to board';
  S.boards.forEach(b=>{const o=document.createElement('option');o.value=b.id;o.textContent=b.name;if(b.id===n.board)o.selected=true;sel.appendChild(o)});
  sel.onchange=()=>moveTo(n.id,sel.value);
  const x=document.createElement('button');x.className='ib x';x.style.fontSize='16px';x.textContent='✕';x.title='Delete';x.onclick=()=>del(n.id);
  f.append(d,sp,sel,x);c.appendChild(f);w.appendChild(c);

  // desktop drag & drop reorder
  c.ondragstart=e=>{dragId=n.id;c.classList.add('drag');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',n.id)};
  c.ondragend=()=>{dragId=null;c.classList.remove('drag')};
  w.ondragover=e=>{if(dragId&&dragId!==n.id)e.preventDefault()};
  w.ondrop=e=>{e.preventDefault();if(!dragId||dragId===n.id)return;
    const a=S.notes.findIndex(z=>z.id===dragId);const [mv]=S.notes.splice(a,1);
    const b=S.notes.findIndex(z=>z.id===n.id);const r=w.getBoundingClientRect();
    S.notes.splice(e.clientY>r.top+r.height/2?b+1:b,0,mv);save();render()};

  // touch swipe: left = delete, right = pin
  let sx=0,dx=0,on=false;
  c.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'||e.target.closest('select,button'))return;on=true;sx=e.clientX;dx=0;c.style.transition='none'});
  c.addEventListener('pointermove',e=>{if(!on)return;dx=e.clientX-sx;if(Math.abs(dx)>10){c.setPointerCapture(e.pointerId);c.style.transform='translateX('+dx+'px)'}});
  const end=()=>{if(!on)return;on=false;c.style.transition='';
    if(dx<-100){c.style.transform='translateX(-110%)';setTimeout(()=>del(n.id),150)}
    else if(dx>100){c.style.transform='';pin(n.id)}
    else c.style.transform=''};
  c.addEventListener('pointerup',end);c.addEventListener('pointercancel',end);
  return w;
}

/* quick add */
function fillSel(sel,val){sel.innerHTML='';S.boards.forEach(b=>{const o=document.createElement('option');o.value=b.id;o.textContent=b.name;if(b.id===val)o.selected=true;sel.appendChild(o)})}
function openAdd(id){pend=null;$('#nt').value='';$('#prev').style.display='none';$('#file').value='';fillSel($('#nb'),id);
  $('#at').textContent='New note';$('#addBack').hidden=false;setTimeout(()=>$('#nt').focus(),50)}
$('#fab').onclick=()=>openAdd(curB);
$('#cancel').onclick=()=>$('#addBack').hidden=true;
$('#addBack').onclick=e=>{if(e.target.id==='addBack')e.target.hidden=true};
$('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1000/Math.max(im.width,im.height));
    const cv=document.createElement('canvas');cv.width=im.width*k;cv.height=im.height*k;cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
    pend=cv.toDataURL('image/jpeg',.72);const p=$('#prev');p.src=pend;p.style.display='block'};im.src=r.result};r.readAsDataURL(f)};
function saveNote(){const text=$('#nt').value.trim();if(!text&&!pend)return;
  const b=$('#nb').value;S.notes.unshift({id:uid(),board:b,text,img:pend,t:Date.now()});save();render();$('#addBack').hidden=true;toast('Added to '+bname(b))}
$('#save').onclick=saveNote;
$('#nt').onkeydown=e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey))saveNote()};

/* board manager */
$('#gear').onclick=()=>{drawBoards();$('#bBack').hidden=false};
function drawBoards(){const l=$('#bList');l.innerHTML='';
  S.boards.forEach(b=>{const r=document.createElement('div');r.className='brow';
    const i=document.createElement('input');i.type='text';i.value=b.name;i.onchange=()=>{b.name=i.value.trim()||b.name;save();render()};
    const x=document.createElement('button');x.className='btn d';x.textContent='Delete';
    x.onclick=()=>{if(S.boards.length<2){toast('Keep at least one board');return}
      if(x.dataset.s!=='1'){x.dataset.s='1';x.textContent='Sure?';return}
      S.notes=S.notes.filter(n=>n.board!==b.id);S.boards=S.boards.filter(z=>z.id!==b.id);save();render();drawBoards()};
    r.append(i,x);l.appendChild(r)})}
$('#addB').onclick=()=>{const v=$('#newB').value.trim();if(!v)return;S.boards.push({id:uid(),name:v});$('#newB').value='';save();render();drawBoards()};
$('#newB').onkeydown=e=>{if(e.key==='Enter')$('#addB').click()};
$('#bDone').onclick=()=>$('#bBack').hidden=true;
$('#bBack').onclick=e=>{if(e.target.id==='bBack')e.target.hidden=true};
$('#exp').onclick=async()=>{const name='noutsit-backup-'+new Date().toISOString().slice(0,10)+'.json',json=JSON.stringify(S);
  try{const P=window.Capacitor&&Capacitor.Plugins;if(P&&P.Filesystem&&P.Share){const r=await P.Filesystem.writeFile({path:name,data:json,directory:'CACHE',encoding:'utf8'});await P.Share.share({title:'Noutsit backup',url:r.uri});return}}catch(e){if(/cancel/i.test(String((e&&e.message)||e)))return}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));a.download=name;a.click()};
$('#imp').onclick=()=>$('#impf').click();
$('#impf').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.boards||!d.notes)throw 0;S=d;save();render();drawBoards();toast('Backup imported')}catch(x){toast('That file isn’t a valid backup')}};r.readAsText(f);e.target.value=''};
load().then(route);
</script>
</body>
</html>
